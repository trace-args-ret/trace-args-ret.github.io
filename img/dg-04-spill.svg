sform="translate(-110.3125, -11.25)"><rect/><foreignObject width="220.625" height="22.5"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 500px; text-align: center;"><span class="nodeLabel"><p>a value the ABI put in a register</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-B-1" data-look="classic" transform="translate(120.9765625, 117)"><rect class="basic label-container" style="" x="-91.28125" y="-19.25" width="182.5625" height="38.5"/><g class="label" style="" transform="translate(-75.28125, -11.25)"><rect/><foreignObject width="150.5625" height="22.5"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 500px; text-align: center;"><span class="nodeLabel"><p>report the value itself</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-B2-3" data-look="classic" transform="translate(120.9765625, 229.25)"><rect class="basic label-container" style="" x="-112.9765625" y="-41.75" width="225.953125" height="83.5"/><g class="label" style="" transform="translate(-96.9765625, -33.75)"><rect/><foreignObject width="193.953125" height="67.5"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 500px; text-align: center;"><span class="nodeLabel"><p>no alloca, nothing escapes,<br />no frame is realigned:<br />target-independent</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-C-5" data-look="classic" transform="translate(391.9609375, 117)"><rect class="basic label-container" style="" x="-96.2578125" y="-30.5" width="192.515625" height="61"/><g class="label" style="" transform="translate(-80.2578125, -22.5)"><rect/><foreignObject width="160.515625" height="45"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 500px; text-align: center;"><span class="nodeLabel"><p>spill it to an alloca and<br />report the slot address</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-D-7" data-look="classic" transform="translate(391.9609375, 229.25)"><rect class="basic label-container" style="" x="-118.0078125" y="-41.75" width="236.015625" height="83.5"/><g class="label" style="" transform="translate(-102.0078125, -33.75)"><rect/><foreignObject width="204.015625" height="67.5"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 500px; text-align: center;"><span class="nodeLabel"><p>the slot escapes, so (K)ASan<br />adds a redzone and<br />32-byte alignment</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-F-9" data-look="classic" transform="translate(391.9609375, 341.5)"><rect class="basic label-container" style="" x="-132.0234375" y="-30.5" width="264.046875" height="61"/><g class="label" style="" transform="translate(-116.0234375, -22.5)"><rect/><foreignObject width="232.046875" height="45"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 500px; text-align: center;"><span class="nodeLabel"><p>the frame is realigned, so the<br />backend reserves a base pointer</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-H-11" data-look="classic" transform="translate(391.9609375, 431.25)"><rect class="basic label-container" style="" x="-123.0078125" y="-19.25" width="246.015625" height="38.5"/><g class="label" style="" transform="translate(-107.0078125, -11.25)"><rect/><foreignObject width="214.015625" height="22.5"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 500px; text-align: center;"><span class="nodeLabel"><p>on x86-64 that register is RBX</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-I-13" data-look="classic" transform="translate(391.9609375, 543.5)"><rect class="basic label-container" style="" x="-131.1953125" y="-53" width="262.390625" height="106"/><g class="label" style="" transform="translate(-115.1953125, -45)"><rect/><foreignObject width="230.390625" height="90"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 500px; text-align: center;"><span class="nodeLabel"><p>a function whose inline asm also<br />claims RBX then fails to build:<br />'Interference usage of base<br />pointer/frame pointer'</p></span></div></foreignObject></g></g></g></g></g><defs><filter id="my-svg-drop-shadow" height="130%" width="130%"><feDropShadow dx="4" dy="4" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs><defs><filter id="my-svg-drop-shadow-small" height="150%" width="150%"><feDropShadow dx="2" dy="2" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs><linearGradient id="my-svg-gradient" gradientUnits="objectBoundingBox" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#0b4f6c" stop-opacity="1"/><stop offset="100%" stop-color="#4a5158" stop-opacity="1"/></linearGradient></svg>